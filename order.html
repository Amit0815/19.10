<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order delivery — Labzak Minimarket</title>
</head>
<link rel="stylesheet" href="styles/style.css">
<body>
    <header>
        <h1>Labzak Minimarket</h1>
    </header>
    <nav>
        <a href="index.html" >Home</a>
        <a href="products.html">Products</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="prices.html">Prices</a>
        <a href="join.html">Join club</a>
        <a href="order.html">Order</a>
    </nav>
    <main>
        <h2>Order delivery</h2>
            <form action="order.html" method="get">
                <p>
                    <label for="name">Your name</label><br>
                    <input type="text" id="name" name="name" required placeholder="Name">
                </p>
                <p>
                    <label for="phone">Phone</label><br>
                    <input type="tel" id="phone" name="phone" required placeholder="998901234567">
                </p>
                <p>
                    <label for="email">E-mail</label><br>
                    <input type="email" id="email" name="email" placeholder="email@gmail.com">
                </p>
                <p>
                    <label for="city">City</label><br>
                    <input type="text" id="city" name="city" value="Tashkent">
                </p>
                <p>
                    <button type="submit">Order</button>
                </p>
            </form>
    </main>
    <footer>
        <p>Labzak Minimarket · Labzak street, Tashkent · 2026</p>
    </footer>
</body>
</html>
